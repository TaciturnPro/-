const GROUPS=[
{id:'g1',s:'常驻错项',n:'1. 常驻错项:惯性、牛三、质点、向心力',b:`
<h4>核心四条</h4>
<ul><li><b>惯性只由质量决定。</b>速度、受力、运动状态全都与惯性大小无关。</li>
<li><b>牛顿第三定律任何情况下都成立。</b>等大、反向、同性质,分别作用在两个物体上,所以永远不能相加求合力。加速、减速、碰撞、静止一律成立。</li>
<li><b>质点取决于所研究的问题。</b>研究转动时,物体再小也不能当质点。</li>
<li><b>向心力按效果命名</b>,是已有力的合力或分力,不是新增的力。受力分析时不要再单独画一个向心力。<b>不存在离心力。</b></li></ul>
<h4>易错对比</h4>
<div class="f bad">✗ 足球触网时速度减小,所以惯性变小 —— 质量没变,惯性不变。</div>
<div class="f bad">✗ 球撞网,球对网的力大于网对球的力 —— 永远等大,否则网不会变形?变形是因为网自身受力,与大小关系无关。</div>
<div class="f good">✓ 鸡蛋碰石头,两者受力大小相等,鸡蛋碎是因为它承受能力差,不是受力更大。</div>`},
{id:'g2',s:'矢量性',n:'2. 矢量性:"相同"与"相等"',b:`
<h4>一句话定生死</h4>
<div class="f"><b>"相同"=大小和方向都一样;"相等"只比大小。</b>位移、速度、Δv、动量、动量变化、冲量都是矢量,题干用"相同"就必须两样都查。</div>
<h4>两个必背对照</h4>
<ul><li><b>平抛</b>:Δv = gΔt,相等时间内 Δv 大小相等、方向都竖直向下 → <b>Δv 一定相同</b>。</li>
<li><b>匀速圆周</b>:相等时间内 Δv 大小相等,但方向时刻在变 → <b>Δv 不一定相同</b>(只有特殊对称情形才相同)。</li></ul>
<p class="n">这两条经常被出题人对调,看到就要条件反射。</p>
<h4>延伸</h4>
<ul><li>匀速圆周:速度在变(方向变),速率不变,动能不变,动量在变。</li>
<li>合外力冲量 = 动量变化量,方向一致。</li></ul>
<div class="f bad">✗ 速率不变就是速度不变 —— 匀速圆周正是反例。</div>`},
{id:'g3',s:'运动图像',n:'3. 运动图像:x-t 与 v-t',b:`
<h4>读图只认四样</h4>
<table>
<tr><td>x-t 斜率</td><td>速度(含正负表方向)</td></tr>
<tr><td>x-t 交点</td><td>两物体相遇</td></tr>
<tr><td>v-t 斜率</td><td>加速度</td></tr>
<tr><td>v-t 面积</td><td>位移(轴下方记负)</td></tr>
</table>
<h4>最容易丢的两条</h4>
<div class="f bad">✗ 把图线形状当轨迹。x-t 图里倾斜直线表示<b>匀速直线运动</b>,不是物体斜着走。两种图都只能描述直线运动。</div>
<div class="f bad">✗ v-t 图中两图线交点表示相遇 —— 交点只表示<b>速度相等</b>。相遇要看面积(位移)是否相等。</div>
<h4>关键推论</h4>
<p>同时同地出发的两物体,<b>速度相等的时刻距离最大或最小</b>,相遇时刻是两图线与 t 轴所围面积相等的时刻。</p>`},
{id:'g4',s:'动态平衡',n:'4. 动态平衡:"缓慢"与动态三角形',b:`
<h4>三个关键词</h4>
<ul><li><b>缓慢</b>:每一时刻都是平衡态,用静力学处理,与速度无关。</li>
<li><b>绳绕过光滑定滑轮</b>:两段绳张力<b>大小相等</b>,这是解题入口。</li>
<li><b>轻绳、轻杆、光滑</b>:各给一个条件,漏一个方程就废。</li></ul>
<h4>动态三角形(三力平衡标准解法)</h4>
<p>物体受三个力:一个大小方向都不变(通常是重力),一个方向不变(如斜面支持力垂直斜面),一个方向在变(绳张力)。把三力首尾相接成封闭三角形,让变化的那条边转动,直接看出各力怎么变。</p>
<div class="f good">✓ 重物沿固定斜面被绳缓慢下放,绳绕过定滑轮:重力不变,支持力方向不变,绳与斜面夹角变化 → 张力和支持力都在单调变小(具体趋势看几何),不是"先减小后增大"。</div>
<h4>整体法与隔离法</h4>
<ul><li>求<b>外力</b>或系统加速度 → 整体法。</li>
<li>求系统<b>内部</b>相互作用力 → 隔离法。</li>
<li>整体法时,内力自动抵消,不要画进受力图。</li></ul>`},
{id:'g5',s:'曲线与圆周',n:'5. 曲线运动与圆周运动临界',b:`
<h4>曲线运动条件</h4>
<ul><li>合力方向与速度方向<b>不共线</b>即做曲线运动,合力指向轨迹<b>凹侧</b>。</li>
<li><b>恒力能做曲线运动</b>(平抛),但<b>不能做匀速圆周</b>,因为匀速圆周的合力方向必须时刻改变。</li></ul>
<h4>平抛必背</h4>
<ul><li>水平匀速、竖直自由落体,两方向独立。</li>
<li>速度偏角 tanθ = v<sub>y</sub>/v<sub>x</sub> = gt/v<sub>0</sub>;位移偏角 tanα = y/x = gt/(2v<sub>0</sub>)。<b>tanθ = 2tanα</b>,别用错对象。</li></ul>
<h4>竖直面最高点临界(高频)</h4>
<table>
<tr><td>绳 / 轨道内侧</td><td>只能提供向下的拉力或压力,最小速度 v = √(gR)</td></tr>
<tr><td>杆 / 双轨道 / 管道</td><td>可以支撑,最小速度可以为 <b>0</b></td></tr>
</table>
<div class="f bad">✗ 所有最高点都要满足 v ≥ √(gR) —— 杆和管道不受此限制。看到"轻杆""细管"立刻改条件。</div>
<h4>水平面转弯临界</h4>
<p>摩擦力提供向心力时,<b>恰好</b>不打滑意味着摩擦力达到最大值 μmg,对应最大速度 v = √(μgR)。</p>`},
{id:'g6',s:'功能与动量',n:'6. 功能关系与动量:符号和适用条件',b:`
<h4>符号关系(最常错)</h4>
<ul><li>重力做功 W<sub>G</sub> = −ΔE<sub>p</sub>。重力做正功,重力势能<b>减少</b>。</li>
<li>合外力做功 = 动能变化(动能定理),恒成立,不限运动形式。</li>
<li>除重力弹力外的力做的功 = 机械能变化。</li></ul>
<h4>摩擦生热</h4>
<div class="f">Q = f·<b>Δx<sub>相对</sub></b>,用<b>相对滑动的路程</b>,不是某个物体对地的位移。</div>
<h4>两个守恒的边界</h4>
<table>
<tr><td>动量守恒</td><td>系统合外力为零;<b>某方向</b>合外力为零 → 该方向守恒;碰撞爆炸中内力远大于外力 → 近似守恒</td></tr>
<tr><td>机械能守恒</td><td>只有重力或弹力做功</td></tr>
</table>
<div class="f bad">✗ 动量守恒就一定机械能守恒 —— 完全非弹性碰撞动量守恒,机械能大量损失。</div>
<div class="f bad">✗ 机械能守恒就一定动量守恒 —— 自由落体机械能守恒,但受重力,动量不守恒。</div>
<h4>功率</h4>
<p>P = Fv 中的 v 是<b>瞬时速度</b>时算瞬时功率,是平均速度时只在 F 恒定且同向时才等于平均功率。F 与 v 有夹角时 P = Fvcosθ。</p>`}
];

const QS=[
{id:'t1q1',g:'g1',r:'概念',t:'足球被踢出后飞行,随后入网并使球网变形。则',
o:['足球在飞行和触网时惯性不变','足球在飞行和触网时受力不变','触网时足球对网的力大于网对足球的力','研究足球入网时的转动可将其视为质点'],a:0,
e:`<div class="opt"><b>A 对</b> 惯性只由质量决定,全程质量不变,惯性不变。速度变了不影响惯性。</div>
<div class="opt"><b>B 错</b> 飞行时只受重力(忽略空气阻力),触网时还多了网的弹力,受力明显改变。</div>
<div class="opt"><b>C 错</b> 牛顿第三定律在任何情况下都成立,两力永远等大反向。</div>
<div class="opt"><b>D 错</b> 研究转动时转动本身就是研究对象,不能视为质点。质点取决于所研究的问题。</div>`},
{id:'t1q2',g:'g1',r:'概念',t:'下列关于质点的说法正确的是',
o:['体积小的物体一定能看成质点','研究地球公转时可把地球看成质点','研究花样滑冰运动员的旋转时可把她看成质点','质量很大的物体一定不能看成质点'],a:1,
e:`<div class="opt"><b>A 错</b> 研究乒乓球旋转时,它再小也不能当质点。大小不是判据。</div>
<div class="opt"><b>B 对</b> 公转时地球直径远小于轨道半径,形状大小影响可忽略。</div>
<div class="opt"><b>C 错</b> 旋转是研究对象本身,不能当质点。</div>
<div class="opt"><b>D 错</b> 地球质量极大,公转时照样可以当质点。</div>`},
{id:'t1q3',g:'g1',m:1,r:'概念',t:'(多选)关于牛顿第三定律,下列说法正确的是',
o:['作用力与反作用力大小相等、方向相反、作用在同一直线上','作用力与反作用力是同种性质的力','作用力与反作用力可以相互抵消,求合力为零','马拉车加速前进时,马拉车的力等于车拉马的力'],a:[0,1,3],
e:`<div class="opt"><b>A 对</b> 这是定律的标准表述。</div>
<div class="opt"><b>B 对</b> 同性质,摩擦力的反作用力一定是摩擦力。</div>
<div class="opt"><b>C 错</b> 两力作用在<b>两个不同物体</b>上,不能求合力,也谈不上抵消。这与二力平衡的本质区别就在这里。</div>
<div class="opt"><b>D 对</b> 加速时也成立。车能加速是因为车受到的合力不为零,不是因为马的力更大。</div>`},
{id:'t1q4',g:'g1',r:'概念',t:'关于向心力,下列说法正确的是',
o:['向心力是物体做圆周运动时额外产生的一种力','向心力按力的作用效果命名,由已有力的合力或分力提供','做圆周运动的物体除受向心力还受离心力','向心力一定由弹力提供'],a:1,
e:`<div class="opt"><b>A 错</b> 向心力不是新增的力,受力分析时不能单独画出。</div>
<div class="opt"><b>B 对</b> 它是效果力,可由重力、弹力、摩擦力、万有引力的合力或分力充当。</div>
<div class="opt"><b>C 错</b> 不存在离心力。离心现象是向心力不足导致的。</div>
<div class="opt"><b>D 错</b> 卫星绕地由万有引力提供,转弯汽车由摩擦力提供。</div>`},
{id:'t1q5',g:'g2',r:'概念',t:'关于曲线运动,下列说法正确的是',
o:['物体在恒力作用下不可能做曲线运动','物体在恒力作用下不可能做匀速圆周运动','做平抛运动的物体在相等的时间内速度的变化量不一定相同','做匀速圆周运动的物体在相等的时间内速度的变化量一定相同'],a:1,
e:`<div class="opt"><b>A 错</b> 平抛就是恒力(重力)作用下的曲线运动。只要力与初速度不共线,轨迹就弯。</div>
<div class="opt"><b>B 对</b> 匀速圆周的合力必须始终指向圆心,方向时刻在变,恒力做不到。</div>
<div class="opt"><b>C 错</b> 平抛 Δv = gΔt,相等时间内大小相等、方向都竖直向下,所以<b>一定相同</b>。</div>
<div class="opt"><b>D 错</b> 匀速圆周相等时间内 Δv 大小相等,但方向一直变,所以<b>不一定相同</b>。</div>
<div class="f">C 和 D 恰好互换。"相同"对矢量意味着大小和方向都相同,这是本题唯一考点。</div>`},
{id:'t1q6',g:'g2',r:'概念',t:'物体做匀速圆周运动,则在任意相等时间内',
o:['速度相同','速率相等,动能不变','动量相同','合力不变'],a:1,
e:`<div class="opt"><b>A 错</b> 速度是矢量,方向时刻改变,不相同。</div>
<div class="opt"><b>B 对</b> 速率(大小)恒定,动能是标量只与速率有关,不变。</div>
<div class="opt"><b>C 错</b> 动量 p=mv 是矢量,方向随速度改变。</div>
<div class="opt"><b>D 错</b> 合力始终指向圆心,大小不变但方向时刻改变,所以"不变"不成立。</div>
<div class="f">本题四个选项全靠"相同 / 相等 / 不变"三个词区分。标量才能只看大小。</div>`},
{id:'t1q7',g:'g2',m:1,r:'概念',t:'(多选)关于动量变化量与冲量,下列说法正确的是',
o:['动量变化量 Δp = p 末 − p 初,是矢量差','合外力的冲量等于动量的变化量,两者方向相同','物体动能不变,动量一定不变','做平抛运动的物体,相等时间内重力的冲量相同'],a:[0,1,3],
e:`<div class="opt"><b>A 对</b> 这是定义,必须按矢量运算,不是直接相减大小。</div>
<div class="opt"><b>B 对</b> 动量定理 I 合 = Δp,方向一致。</div>
<div class="opt"><b>C 错</b> 匀速圆周动能不变而动量时刻在变;物体以相同速率反弹也是反例。</div>
<div class="opt"><b>D 对</b> 重力是恒力,I = mgΔt,相等时间内大小方向都相同。</div>`},
{id:'t1q8',g:'g2',r:'概念',t:'物体做变速运动,下列情形中可能出现的是',
o:['速度大小不变而速度方向改变','加速度不为零而速度大小不变','加速度为零而速度不断改变','速度为零而加速度不为零'],a:[0],m:1,
e:`<div class="opt"><b>A 可能</b> 匀速圆周运动。</div>
<div class="opt"><b>B 可能</b> 同样是匀速圆周,加速度始终指向圆心。</div>
<div class="opt"><b>C 不可能</b> 加速度为零意味着速度不变,与"不断改变"矛盾。</div>
<div class="opt"><b>D 可能</b> 竖直上抛最高点,v=0 而 a=g。</div>
<div class="f">正确选项为 A、B、D。本题提醒:加速度与速度是两个独立量,只有方向关系决定加速或减速。</div>`},
{id:'t1q9',g:'g3',r:'概念',t:'在位移—时间(x-t)图像中,一条倾斜的直线表示物体',
o:['做匀加速直线运动','做匀速直线运动','沿倾斜方向运动','做曲线运动'],a:1,
e:`<div class="opt"><b>A 错</b> 匀加速在 x-t 图中是抛物线。</div>
<div class="opt"><b>B 对</b> 斜率即速度,直线说明速度恒定。</div>
<div class="opt"><b>C 错</b> 图线形状不是运动轨迹,x-t 图只描述直线运动。</div>
<div class="opt"><b>D 错</b> 同上,图线弯直与轨迹无关。</div>`},
{id:'t1q10',g:'g3',r:'条件',t:'甲、乙两车在同一直线上同时同地同向出发。甲由静止开始做匀加速运动,加速度 2 m/s²;乙做匀速运动,速度 6 m/s。则',
o:['t = 3 s 时两车相遇','t = 3 s 时两车相距最远,为 9 m','t = 6 s 时两车相遇','t = 6 s 时甲、乙速度相等'],a:2,

<div class="opt"><b>C 对</b> 令 ½×2×t² = 6t 得 t = 6 s,位移同为 36 m,两车相遇。</div>

{id:'t1q11',g:'g3',r:'概念',t:'v-t 图像中,图线与时间轴所围的面积表示',
o:['加速度','速度的变化量','位移,时间轴下方的面积取负值','路程,各段面积直接相加'],a:2,
e:`<div class="opt"><b>A 错</b> 加速度是 v-t 图的斜率。</div>

<div class="opt"><b>C 对</b> 面积即位移,轴下方表示反向运动,记负。</div>
<div class="opt"><b>D 错</b> 求路程才把各段面积取<b>绝对值</b>后相加。</div>`},
{id:'t1q12',g:'g4',r:'条件',t:'工人用绕过定滑轮的绳索将重物(视为质点)缓慢下放,重物沿固定斜面缓慢向下移动。不计绳重和一切摩擦,该过程中',
o:['绳索的拉力先减小后增大','绳索的拉力一直增大','重物对斜面的压力一直减小','地面对斜面的支持力一直增大'],a:2,
e:`<div class="opt"><b>A、B 错</b> 重物受重力、斜面支持力(方向垂直斜面不变)、绳张力三个力。"缓慢"说明每时刻平衡。随重物下移,绳与斜面的夹角增大,作动态三角形可知张力<b>单调减小</b>,不存在先减后增,也不会增大。</div>
<div class="opt"><b>C 对</b> 由动态三角形,支持力同样单调减小,由牛三,重物对斜面的压力一直减小。</div>
<div class="opt"><b>D 错</b> 对"斜面 + 重物"整体受力:重力不变,绳张力在减小且其竖直分量变化,地面支持力随之<b>减小</b>而非增大。</div>
<div class="f">入口有两个:绳绕过光滑定滑轮两段张力相等;"缓慢"等于每时刻静力平衡。三力中有一个方向不变、一个大小方向都不变时,动态三角形最快。</div>`},
{id:'t1q13',g:'g4',r:'条件',t:'用水平力 F 将物块缓慢压在竖直墙面上并保持静止,逐渐增大 F,则墙对物块的摩擦力',
o:['逐渐增大','逐渐减小','保持不变,等于物块重力','方向向下'],a:2,
e:`<div class="opt"><b>A、B 错</b> 竖直方向只有重力和静摩擦力,平衡要求摩擦力恒等于 mg,与 F 无关。</div>
<div class="opt"><b>C 对</b> f = mg 不变。增大 F 只增大最大静摩擦的上限,不改变实际值。</div>
<div class="opt"><b>D 错</b> 必须向上才能平衡重力。</div>
<div class="f">静摩擦力大小由平衡条件决定,不由 μF<sub>N</sub> 算。μF<sub>N</sub> 只是上限。</div>`},
{id:'t1q14',g:'g4',m:1,r:'条件',t:'(多选)关于整体法与隔离法,下列说法正确的是',
o:['求系统受到的外力时优先用整体法','求系统内部物体间的相互作用力必须用隔离法','用整体法时系统内力要画入受力图','整体法要求系统内各物体加速度相同或已知'],a:[0,1,3],
e:`<div class="opt"><b>A 对</b> 内力自动抵消,方程最少。</div>
<div class="opt"><b>B 对</b> 内力在整体法中不出现,必须隔离才能求。</div>
<div class="opt"><b>C 错</b> 内力绝不能画入整体受力图,这是整体法最常见的错误。</div>
<div class="opt"><b>D 对</b> 加速度不同时需分别列式或用 F = m₁a₁ + m₂a₂ 的形式。</div>`},
{id:'t1q15',g:'g5',r:'公式',t:'做平抛运动的物体,其速度方向与水平方向夹角 θ、位移方向与水平方向夹角 α 满足',
o:['tanθ = tanα','tanθ = 2tanα','2tanθ = tanα','θ = α'],a:1,
e:`<div class="opt"><b>B 对</b> tanθ = v<sub>y</sub>/v<sub>x</sub> = gt/v<sub>0</sub>,tanα = y/x = (½gt²)/(v<sub>0</sub>t) = gt/(2v<sub>0</sub>),所以 tanθ = 2tanα。</div>
<div class="opt"><b>A、D 错</b> 速度方向总比位移方向更"陡",两角不相等。</div>
<div class="opt"><b>C 错</b> 关系写反了,这是最常见的记忆错误。</div>
<div class="f">记法:速度偏角更大,所以 tan 值大的那个(θ)前面不带系数、另一边乘 2。</div>`},
{id:'t1q16',g:'g5',r:'条件',t:'小球在竖直面内做圆周运动,通过最高点时',
o:['若用轻绳连接,最小速度为 0','若用轻杆连接,最小速度为 √(gR)','若用轻绳连接,最小速度为 √(gR)','无论绳或杆,最小速度都是 √(gR)'],a:2,
e:`<div class="opt"><b>A 错</b> 绳只能拉不能支撑,v=0 时球会脱离圆轨道下落。</div>
<div class="opt"><b>B 错</b> 杆可以提供向上的支撑力,最小速度可以为 0。</div>
<div class="opt"><b>C 对</b> 绳的临界条件是重力恰好提供向心力:mg = mv²/R,得 v = √(gR)。</div>
<div class="opt"><b>D 错</b> 混淆了两种模型。</div>
<div class="f">看到"轻杆""细管""双轨道"就把 √(gR) 的限制去掉;看到"轻绳""轨道内侧"就加上。</div>`},
{id:'t1q17',g:'g5',m:1,r:'条件',t:'(多选)汽车在水平公路上转弯,靠摩擦力提供向心力。下列说法正确的是',
o:['汽车恰好不打滑时,摩擦力达到最大静摩擦力','最大转弯速度 v = √(μgR),与汽车质量无关','转弯半径越大,允许的最大速度越大','速度超过最大值时,汽车受到离心力作用而滑出'],a:[0,1,2],
e:`<div class="opt"><b>A 对</b> "恰好"即临界,摩擦力取最大值。</div>
<div class="opt"><b>B 对</b> μmg = mv²/R,质量约掉,v = √(μgR)。</div>
<div class="opt"><b>C 对</b> v 与 √R 成正比。</div>
<div class="opt"><b>D 错</b> 不存在离心力。滑出是因为所需向心力超过摩擦力能提供的上限,属于离心现象。</div>`},
{id:'t1q18',g:'g5',r:'概念',t:'做曲线运动的物体,其所受合力',
o:['一定指向轨迹的凹侧','一定与速度方向垂直','大小一定改变','一定是变力'],a:0,
e:`<div class="opt"><b>A 对</b> 合力指向轨迹凹的那一侧,这是判断轨迹弯曲方向的依据。</div>
<div class="opt"><b>B 错</b> 只有匀速圆周等特殊情况才垂直,平抛中重力与速度不垂直。</div>
<div class="opt"><b>C 错</b> 平抛中合力(重力)大小不变。</div>
<div class="opt"><b>D 错</b> 同上,恒力也能做曲线运动。</div>`},
{id:'t1q19',g:'g6',r:'概念',t:'物体从高处自由下落,下列说法正确的是',
o:['重力做正功,重力势能增加','重力做正功,重力势能减少','重力做负功,重力势能减少','重力做的功等于重力势能的增加量'],a:1,
e:`<div class="opt"><b>B 对</b> W<sub>G</sub> = −ΔE<sub>p</sub>,重力做正功时势能减少。</div>
<div class="opt"><b>A、C 错</b> 把符号关系记反。下落时重力与位移同向,做正功。</div>
<div class="opt"><b>D 错</b> 等于势能的<b>减少</b>量,少了负号整题就错。</div>`},
{id:'t1q20',g:'g6',r:'公式',t:'物块在木板上滑动,滑动摩擦力大小为 f,物块对地位移 s₁,木板对地位移 s₂(同向,s₁ > s₂),则摩擦产生的热量为',
o:['f·s₁','f·s₂','f·(s₁ − s₂)','f·(s₁ + s₂)'],a:2,
e:`<div class="opt"><b>C 对</b> Q = f × <b>相对位移</b>,同向时取之差。</div>
<div class="opt"><b>A、B 错</b> 用单个物体对地位移算的是摩擦力对该物体做的功,不是生热。</div>
<div class="opt"><b>D 错</b> 反向运动时才用和。</div>
<div class="f">摩擦力对两物体做功的代数和(负值)其绝对值才等于 Q,数值上就是 f 乘相对路程。</div>`},
{id:'t1q21',g:'g6',m:1,r:'条件',t:'(多选)下列过程中,系统动量守恒的是',
o:['光滑水平面上两小球发生碰撞','粗糙水平面上两小球碰撞的瞬间(内力远大于摩擦力)','人在静止的小车上行走,车与地面光滑','竖直上抛的小球在空中运动'],a:[0,1,2],
e:`<div class="opt"><b>A 对</b> 合外力为零,严格守恒。</div>
<div class="opt"><b>B 对</b> 碰撞时间极短,内力远大于外力,可近似守恒。</div>
<div class="opt"><b>C 对</b> 水平方向合外力为零,水平方向动量守恒。</div>
<div class="opt"><b>D 错</b> 受重力,合外力不为零,动量不守恒(机械能守恒)。</div>
<div class="f">"某方向合外力为零则该方向守恒"是最常用也最容易漏的一条。</div>`},
{id:'t1q22',g:'g6',m:1,r:'概念',t:'(多选)关于动量守恒与机械能守恒的关系,下列说法正确的是',
o:['动量守恒的系统,机械能不一定守恒','机械能守恒的系统,动量不一定守恒','完全非弹性碰撞中动量守恒,机械能不守恒','弹性碰撞中两者都守恒'],a:[0,1,2,3],
e:`<div class="opt"><b>A 对</b> 完全非弹性碰撞就是反例。</div>
<div class="opt"><b>B 对</b> 自由落体机械能守恒,但受重力,动量不守恒。</div>
<div class="opt"><b>C 对</b> 碰后速度相同,动能损失最大。</div>
<div class="opt"><b>D 对</b> 弹性碰撞的定义就是动能无损失。</div>
<div class="f">四个都对的题要敢全选。两个守恒的适用条件完全独立,互不蕴含。</div>`},
{id:'t1q23',g:'g6',r:'公式',t:'关于功率公式 P = Fvcosθ,下列说法正确的是',
o:['v 取瞬时速度时,P 为瞬时功率','v 取平均速度时,P 一定是平均功率','功率越大说明做的功越多','θ = 90° 时功率最大'],a:0,
e:`<div class="opt"><b>A 对</b> 这是瞬时功率的定义式。</div>
<div class="opt"><b>B 错</b> 只有 F 恒定且与 v 同向时才成立,否则平均功率要用 W/t。</div>
<div class="opt"><b>C 错</b> 功率是做功快慢,还要看时间。</div>
<div class="opt"><b>D 错</b> θ=90° 时 cosθ=0,功率为零,力不做功。</div>`},
{id:'t1q24',g:'g6',r:'条件',t:'关于动能定理 W 合 = ΔE<sub>k</sub>,下列说法正确的是',
o:['只适用于恒力做功','只适用于直线运动','对变力和曲线运动同样适用','要求物体只受重力'],a:2,
e:`<div class="opt"><b>C 对</b> 动能定理不限力的性质和运动轨迹,这是它比牛顿定律好用的地方。</div>
<div class="opt"><b>A、B 错</b> 适用范围被人为缩小,很多多过程变力问题正是靠它求解。</div>
<div class="opt"><b>D 错</b> 那是机械能守恒的条件,不是动能定理。</div>
<div class="f">W 合是所有力做功的代数和,含摩擦、弹力、拉力等全部。</div>`}
];
initTopic({groups:GROUPS,qs:QS});
